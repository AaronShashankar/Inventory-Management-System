          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 120
        is_active:
          type: boolean
        organization:
          type: string
          format: uuid
          readOnly: true
        warehouse:
          type: string
          format: uuid
      required:
      - code
      - created_at
      - id
      - organization
      - updated_at
      - warehouse
      - warehouse_name
    LocationRequest:
      type: object

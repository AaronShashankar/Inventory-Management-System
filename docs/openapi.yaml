components:
  schemas:
    ActivityOutput:
      type: object
      properties:
        day:
          type: string
          format: date
        document__type:
          type: string
        quantity:
          type: integer
        movements:
          type: integer
      required:
      - day
      - document__type
      - movements
      - quantity
    AdjustmentDirectionEnum:
      enum:
      - IN
      - OUT
      type: string
      description: |-
        * `IN` - IN
        * `OUT` - OUT
    Audit:
      type: object
      description: Scope relation choices before validating; caller cannot supply
        a tenant ID.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_name:
          type: string
          default: System
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          maxLength: 80
        entity_type:
          type: string
          maxLength: 80
        entity_id:
          type: string
          maxLength: 80
        details: {}
        request_id:
          type: string
          maxLength: 36
        organization:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          nullable: true
      required:
      - action
      - created_at
      - entity_id
      - entity_type
      - id
      - organization
      - updated_at
    Balance:
      type: object
      description: Scope relation choices before validating; caller cannot supply
        a tenant ID.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
        product_name:
          type: string
        warehouse_name:
          type: string
        location_code:
          type: string
        unit_code:
          type: string
        reorder_level:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        on_hand:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        organization:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
        location:
          type: string
          format: uuid
      required:
      - created_at
      - id
      - location
      - location_code
      - organization
      - product
      - product_name
      - reorder_level
      - sku
      - unit_code
      - updated_at
      - warehouse_name
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      description: Scope relation choices before validating; caller cannot supply
        a tenant ID.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 120
        organization:
          type: string
          format: uuid
          readOnly: true
      required:
      - created_at
      - id
      - name
      - organization
      - updated_at
    CategoryRequest:
      type: object
      description: Scope relation choices before validating; caller cannot supply
        a tenant ID.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
    CsrfOutput:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    DashboardOutput:
      type: object
      properties:
        active_skus:
          type: integer
        low_stock_count:
          type: integer
        open_purchase_orders:
          type: integer
        movements_today:
          type: integer
        low_stock:
          type: array
          items:
            $ref: '#/components/schemas/StockRowOutput'
        recent_movements:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
        activity:
          type: array
          items:
            $ref: '#/components/schemas/ActivityOutput'
      required:
      - active_skus
      - activity
      - low_stock
      - low_stock_count
      - movements_today
      - open_purchase_orders
      - recent_movements
    EmailInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    HealthOutput:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    InviteInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
